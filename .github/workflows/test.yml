name: Test
on:
  push:
    branches: [main]
  pull_request:
# A newer push to the same pull request cancels this run. On main a running build
# finishes; a newer merge only replaces a run that is still waiting for a runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s tests -v
